<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <link rel="icon" type="image/svg+xml" href="/rawseedapp/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rawseed</title>
    <script type="module" crossorigin src="/rawseedapp/assets/index-BU3PBbtx.js"></script>
    <link rel="stylesheet" crossorigin href="/rawseedapp/assets/index-DDOFGwwU.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      const heroImages = {
        "/rawseedapp": "rawseed-hero",
        "/rawseedapp/": "rawseed-hero",
        "/rawseedapp/sesame-oil": "sesame_seed_hero",
        "/rawseedapp/flaxseed-oil": "flaxseed_oil_hero",
        "/rawseedapp/blackseed-oil": "blackseed_hero_4k",
        "/rawseedapp/about-us": "about_us_hero",
        "/rawseedapp/contact": "flaxseed_flower_farm",
      };

      const heroImage = heroImages[window.location.pathname];

      if (heroImage) {
        const preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "image";
        preload.href = `/rawseedapp/${heroImage}-1600.webp`;
        preload.imageSrcset = `
          /rawseedapp/${heroImage}-480.webp 480w,
          /rawseedapp/${heroImage}-800.webp 800w,
          /rawseedapp/${heroImage}-1600.webp 1600w,
          /rawseedapp/${heroImage}-1980.webp 1980w
        `;
        preload.imageSizes = "100vw";
        preload.type = "image/webp";
        document.head.appendChild(preload);
      }
    </script>
  </body>
</html>
